# Packages that ship content in /var. An installed bootc system doesn't get
# /var from the image, so recreate what these need on every boot. Existing
# files are left alone.

# ufw refuses to start without its rule files; the defaults are saved by
# finalize.sh
C /var/lib/ufw - - - - /usr/share/darksaber/ufw

# libvirt can't create these itself under SELinux, so its default NAT network
# fails to start. z and Z restore the labels on installs where these were
# already created with the wrong ones (VM state and UEFI NVRAM live in qemu/).
z /var/lib/libvirt - - - -
Z /var/lib/libvirt/qemu - - - -
Z /var/cache/libvirt - - - -
d /var/lib/libvirt/boot 0711 root root -
d /var/lib/libvirt/dnsmasq 0755 root root -
d /var/lib/libvirt/filesystems 0711 root root -
d /var/lib/libvirt/images 0711 root root -
d /var/lib/libvirt/network 0700 root root -
d /var/lib/libvirt/swtpm 0711 root root -
d /var/log/libvirt 0700 root root -
d /var/log/libvirt/qemu 0700 root root -
# Virtual TPMs (Windows 11 VMs)
d /var/lib/swtpm-localca 0750 tss root -
d /var/log/swtpm/libvirt/qemu 0730 tss tss -
