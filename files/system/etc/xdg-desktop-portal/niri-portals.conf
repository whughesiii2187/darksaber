# Overrides /usr/share/xdg-desktop-portal/niri-portals.conf from the niri
# package. The only change is FileChooser=gtk: xdg-desktop-portal-gnome's
# file chooser hands off to GNOME Shell, which isn't running under niri, so
# Flatpak "Open"/"Save" dialogs silently never appear.

[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
