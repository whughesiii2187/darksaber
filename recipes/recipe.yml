---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: darksaber
# description will be included in the image's metadata
description: Fedora Atomic with Niri and DankMaterialShell.

# Universal Blue's desktop-less Fedora Atomic image: codecs, firmware and
# hardware support are already in, with no GNOME/KDE to fight with.
base-image: ghcr.io/ublue-os/base-main
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: dnf
    repos:
      copr:
        - yalter/niri
        - avengemedia/danklinux
        - avengemedia/dms
    install:
      packages:
        # --- Compositor & shell ---
        - niri
        - xwayland-satellite # X11 apps under Niri (auto-started by niri)
        - dms
        - dms-cli
        - quickshell
        - dgop # system monitor backend for DMS
        - danksearch # file search for the DMS launcher
        - matugen # wallpaper-based theming
        - cliphist # clipboard history
        - cava # audio visualizer widget
        - material-symbols-fonts
        - accountsservice
        - qt6-qtmultimedia
        - qt6-qtimageformats
        - qt6ct
        - adw-gtk3-theme # lets matugen theme GTK3 apps

        # --- Login ---
        - greetd
        - greetd-selinux
        - dms-greeter
        - gnome-keyring
        - gnome-keyring-pam
        - gcr # ssh-agent + keyring prompts

        # --- Portals & Wayland tooling ---
        - xdg-desktop-portal-gnome # screencasting / screen sharing
        - xdg-desktop-portal-gtk # file pickers
        - xdg-user-dirs
        - xdg-utils
        - xdg-terminal-exec
        - wl-clipboard
        - wl-mirror
        - wtype
        - brightnessctl
        - ddcutil # external monitor brightness
        - playerctl

        # --- Core apps ---
        - ghostty
        - nautilus
        - nautilus-python
        - file-roller
        - gnome-disk-utility
        - nm-connection-editor
        - imv # image viewer
        - mpv # video player
        - yt-dlp # lets mpv play YouTube/online URLs
        # Keyboard-driven PDF viewer, alternative to the Papers flatpak
        # - zathura
        # - zathura-pdf-mupdf

        # --- Hardware & services ---
        - NetworkManager-wifi
        - NetworkManager-bluetooth
        - NetworkManager-openvpn
        - NetworkManager-openconnect
        - wireguard-tools
        - bluez
        - bluez-tools
        - pipewire
        - pipewire-pulseaudio
        - wireplumber
        - tuned
        - tuned-ppd # power profiles for the DMS battery menu
        - upower
        - fprintd
        - fprintd-pam
        - iio-sensor-proxy # auto-rotation / ambient light
        - bolt # Thunderbolt
        - fwupd
        - ufw
        - cups
        - cups-pk-helper
        - system-config-printer
        - system-config-printer-udev
        - hplip # HP printer drivers
        - fuse-libs # AppImages
        - gvfs-smb
        - gvfs-mtp
        - gvfs-gphoto2
        - gvfs-nfs
        - ifuse
        - udisks2

        # --- Fonts ---
        - default-fonts
        - google-noto-color-emoji-fonts
        - jetbrains-mono-fonts-all
        - fontawesome-fonts-all

        # --- Virtualization ---
        - libvirt-daemon-kvm # QEMU/KVM libvirt drivers only (no Xen/VirtualBox/LXC)
        - libvirt-daemon-config-network # "default" NAT network
        - virt-manager
        - edk2-ovmf # UEFI firmware for VMs
        - swtpm # virtual TPM (Windows 11)

        # --- CLI essentials ---
        - zsh
        - distrobox
        - podman
        - git-core
        - just
        - fastfetch
        - btop
        - inxi
        - jq
        - fzf
        - wev
        - wget2-wget
        - unzip
        - 7zip

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: systemd
    system:
      enabled:
        - greetd.service
        - tuned.service
        - bluetooth.service
        - ufw.service
        - darksaber-ufw-setup.service
        - darksaber-libvirt-group.service
        - virtqemud.socket
        - virtnetworkd.socket
        - virtstoraged.socket
        - virtnodedevd.socket
        - virtsecretd.socket
        - virtinterfaced.socket
        - virtproxyd.socket
      disabled:
        - NetworkManager-wait-online.service
    user:
      enabled:
        - dms.service
        - dsearch.service
        - darksaber-niri-config.service

  - type: brew # Homebrew for CLI tools, managed by the first user (UID 1000)
    brew-analytics: false

  - type: script
    scripts:
      - finalize.sh

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - io.github.kolunmi.Bazaar # app store
          - com.github.tchx84.Flatseal
          - org.gnome.TextEditor
          - org.gnome.Papers # PDFs
          - org.gnome.Calculator
          - org.libreoffice.LibreOffice
          - it.mijorus.gearlever # AppImage manager
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
